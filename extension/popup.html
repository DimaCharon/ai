<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --bg:#0d0f13; --bg2:#14161c; --line:rgba(255,255,255,.09);
    --ink:#eef1f8; --mut:#98a1b5; --amber:#e5714b; --amber2:#ff9a62;
    --green:#5ee28f; --red:#ff6b57;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:300px;}
  body{
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--ink); font-size:13px; line-height:1.45;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
  }
  .head{
    padding:14px 16px 12px; border-bottom:1px solid var(--line);
    background:linear-gradient(135deg, rgba(229,113,75,.14), rgba(0,0,0,0) 60%);
  }
  .head h1{font-size:14.5px; font-weight:800; letter-spacing:.2px;}
  .head p{font-size:11.5px; color:var(--mut); margin-top:3px;}
  .rows{padding:12px 16px 4px;}
  .row{display:flex; align-items:center; gap:9px; padding:5px 0; font-size:12.5px;}
  .row .lbl{color:var(--mut);}
  .st{margin-left:auto; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .st.ok{color:var(--green);} .st.bad{color:var(--red);} .st.wait{color:var(--mut);}
  .foot{padding:10px 16px 16px;}
  .btn{
    width:100%; padding:11px; border:0; border-radius:11px; cursor:pointer;
    font-size:13.5px; font-weight:800; letter-spacing:.3px; color:#1a0e08;
    background:linear-gradient(135deg, var(--amber2), var(--amber));
    box-shadow:0 6px 18px rgba(229,113,75,.35); transition:transform .08s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:scale(.985);}
  .btn:disabled{filter:grayscale(.5); opacity:.6; cursor:default;}
  .res{margin-top:10px; font-size:11.5px; line-height:1.5; color:var(--mut); white-space:pre-wrap; min-height:0;}
  .res.ok{color:var(--green);} .res.bad{color:var(--red);}
</style>
</head>
<body>
  <div class="head">
    <h1>🐱 Charon Code · Arena Bridge</h1>
    <p>Передаёт свежую сессию arena.ai в локальное приложение</p>
  </div>
  <div class="rows">
    <div class="row"><span class="lbl">Приложение Charon Code</span><span class="st wait" id="st-app">проверяю…</span></div>
    <div class="row"><span class="lbl">Сессия arena.ai в браузере</span><span class="st wait" id="st-cook">проверяю…</span></div>
  </div>
  <div class="foot">
    <button class="btn" id="btn-push">⚡ Передать сессию</button>
    <div class="res" id="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
